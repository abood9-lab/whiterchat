openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Pixlr API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: posts
  - name: stories
  - name: notifications
  - name: conversations
  - name: explore
  - name: reels
  - name: ai
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ────────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateMyProfile
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Password changed

  # ── Users ───────────────────────────────────────────────────────────────────
  /users/suggestions:
    get:
      operationId: getSuggestedUsers
      tags: [users]
      responses:
        "200":
          description: Suggested users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"

  /users/complete-setup:
    post:
      operationId: completeSetup
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Profile setup complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/me/saved:
    get:
      operationId: getSavedPosts
      tags: [users]
      responses:
        "200":
          description: Saved posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

  /users/me/blocked:
    get:
      operationId: getBlockedUsers
      tags: [users]
      responses:
        "200":
          description: Blocked users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"

  /users/upload-avatar:
    post:
      operationId: uploadAvatar
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadInput"
      responses:
        "200":
          description: Uploaded avatar URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /users/{username}:
    get:
      operationId: getUserProfile
      tags: [users]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/{username}/posts:
    get:
      operationId: getUserPosts
      tags: [users]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

  /users/{username}/follow:
    post:
      operationId: followUser
      tags: [users]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Followed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
    delete:
      operationId: unfollowUser
      tags: [users]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unfollowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /users/{username}/followers:
    get:
      operationId: getFollowers
      tags: [users]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Followers list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"

  /users/{username}/following:
    get:
      operationId: getFollowing
      tags: [users]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Following list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"

  /users/{username}/block:
    post:
      operationId: blockUser
      tags: [users]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /users/{username}/unblock:
    post:
      operationId: unblockUser
      tags: [users]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unblocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /users/{username}/report:
    post:
      operationId: reportUser
      tags: [users]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Reported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  # ── Posts ───────────────────────────────────────────────────────────────────
  /posts/feed:
    get:
      operationId: getFeed
      tags: [posts]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"

  /posts/upload:
    post:
      operationId: uploadPostMedia
      tags: [posts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadInput"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /posts:
    post:
      operationId: createPost
      tags: [posts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{postId}:
    get:
      operationId: getPost
      tags: [posts]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
    patch:
      operationId: updatePost
      tags: [posts]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdate"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
    delete:
      operationId: deletePost
      tags: [posts]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /posts/{postId}/like:
    post:
      operationId: likePost
      tags: [posts]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Like toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"

  /posts/{postId}/save:
    post:
      operationId: savePost
      tags: [posts]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Save toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveResult"

  /posts/{postId}/report:
    post:
      operationId: reportPost
      tags: [posts]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "200":
          description: Reported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /posts/{postId}/comments:
    get:
      operationId: getPostComments
      tags: [posts]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [posts]
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /comments/{commentId}:
    delete:
      operationId: deleteComment
      tags: [posts]
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /comments/{commentId}/like:
    post:
      operationId: likeComment
      tags: [posts]
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Like toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"

  # ── Stories ─────────────────────────────────────────────────────────────────
  /stories/feed:
    get:
      operationId: getStoriesFeed
      tags: [stories]
      responses:
        "200":
          description: Stories feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserStories"

  /stories/mine:
    get:
      operationId: getMyStories
      tags: [stories]
      responses:
        "200":
          description: My stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Story"

  /stories/upload:
    post:
      operationId: uploadStoryMedia
      tags: [stories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadInput"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /stories:
    post:
      operationId: createStory
      tags: [stories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryInput"
      responses:
        "201":
          description: Created story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"

  /stories/{storyId}/view:
    post:
      operationId: viewStory
      tags: [stories]
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Viewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /stories/{storyId}/react:
    post:
      operationId: reactToStory
      tags: [stories]
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionInput"
      responses:
        "200":
          description: Reacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /stories/{storyId}:
    delete:
      operationId: deleteStory
      tags: [stories]
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /stories/highlights:
    post:
      operationId: createHighlight
      tags: [stories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HighlightInput"
      responses:
        "201":
          description: Created highlight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Highlight"

  /stories/highlights/user/{username}:
    get:
      operationId: getUserHighlights
      tags: [stories]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Highlights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Highlight"

  /stories/highlights/{id}:
    delete:
      operationId: deleteHighlight
      tags: [stories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  # ── Notifications ───────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationsCount
      tags: [notifications]
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  # ── Conversations / Messages ─────────────────────────────────────────────────
  /conversations:
    get:
      operationId: getConversations
      tags: [conversations]
      parameters:
        - name: archived
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}/read:
    post:
      operationId: markConversationRead
      tags: [conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /messages:
    post:
      operationId: sendMessage
      tags: [conversations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  # ── Explore / Search ─────────────────────────────────────────────────────────
  /explore/posts:
    get:
      operationId: getExplorePosts
      tags: [explore]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Explore posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"

  /search/users:
    get:
      operationId: searchUsers
      tags: [explore]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"

  # ── Push Notifications ──────────────────────────────────────────────────────
  /push/vapid-public-key:
    get:
      operationId: getVapidPublicKey
      tags: [push]
      responses:
        "200":
          description: VAPID public key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidPublicKeyResponse"

  /push/subscribe:
    post:
      operationId: subscribeToPush
      tags: [push]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "201":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /push/unsubscribe:
    post:
      operationId: unsubscribeFromPush
      tags: [push]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushUnsubscribeInput"
      responses:
        "200":
          description: Unsubscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  # ── AI ────────────────────────────────────────────────────────────────────────
  /ai/caption:
    post:
      operationId: generateCaption
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptionInput"
      responses:
        "200":
          description: Generated caption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptionResult"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Auth ──────────────────────────────────────────────────────────────────
    RegisterInput:
      type: object
      required: [username, email, password, fullName]
      properties:
        username: { type: string }
        email: { type: string }
        password: { type: string }
        fullName: { type: string }

    LoginInput:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string }
        password: { type: string }

    RefreshTokenInput:
      type: object
      properties:
        refreshToken: { type: string }

    TokenPair:
      type: object
      required: [token, refreshToken]
      properties:
        token: { type: string }
        refreshToken: { type: string }

    AuthResponse:
      type: object
      required: [token, refreshToken, user]
      properties:
        token: { type: string }
        refreshToken: { type: string }
        user:
          $ref: "#/components/schemas/UserProfile"

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string }

    # ── Users ─────────────────────────────────────────────────────────────────
    UserSummary:
      type: object
      required: [id, username, fullName]
      properties:
        id: { type: string }
        username: { type: string }
        fullName: { type: string }
        avatarUrl: { type: ["string", "null"] }
        isFollowing: { type: boolean }

    UserProfile:
      type: object
      required: [id, username, fullName]
      properties:
        id: { type: string }
        username: { type: string }
        fullName: { type: string }
        bio: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        gender: { type: ["string", "null"] }
        pronouns: { type: ["string", "null"] }
        dateOfBirth: { type: ["string", "null"] }
        interests: { type: array, items: { type: string } }
        profileCompleted: { type: boolean }
        postsCount: { type: integer }
        followersCount: { type: integer }
        followingCount: { type: integer }
        isFollowing: { type: boolean }
        isMe: { type: boolean }
        isBlocked: { type: boolean }
        createdAt: { type: string }

    ProfileUpdate:
      type: object
      properties:
        fullName: { type: string }
        bio: { type: string }
        website: { type: string }
        gender: { type: string }
        pronouns: { type: string }
        dateOfBirth: { type: string }
        interests: { type: array, items: { type: string } }
        avatarUrl: { type: string }

    MediaUploadInput:
      type: object
      required: [data, mimeType]
      properties:
        data: { type: string }
        mimeType: { type: string }

    UploadResult:
      type: object
      required: [url]
      properties:
        url: { type: string }
        publicId: { type: string }
        resourceType: { type: string }

